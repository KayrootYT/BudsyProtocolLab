name: Build Budsy Protocol Lab APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'BudsyProtocolLab_with_workflow.zip'
      - 'BudsyProtocolLab.zip'
      - 'BudsyProtocolLab/**'
      - 'scripts/patch_bluetooth.py'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded project ZIP
        run: |
          if [ -f BudsyProtocolLab_with_workflow.zip ]; then
            ZIP_FILE="BudsyProtocolLab_with_workflow.zip"
          elif [ -f BudsyProtocolLab.zip ]; then
            ZIP_FILE="BudsyProtocolLab.zip"
          else
            echo "No project ZIP found in repository root."
            ls -la
            exit 1
          fi
          echo "Using $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d .
          test -f BudsyProtocolLab/settings.gradle
          python3 scripts/patch_bluetooth.py
          grep -q 'scanResults = new LinkedHashMap' BudsyProtocolLab/app/src/main/java/com/budsy/protocollab/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify preinstalled Android SDK
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: BudsyProtocolLab
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BudsyProtocolLab-debug-apk
          path: BudsyProtocolLab/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
